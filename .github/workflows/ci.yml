name: CI

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main]

jobs:
  backend-lint:
    name: Backend — Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt
          pip install ruff mypy

      - name: Ruff lint
        run: cd backend && ruff check app/ --output-format=github

      - name: Type check (mypy)
        run: cd backend && mypy app/ --ignore-missing-imports --no-strict-optional
        continue-on-error: true  # warning only until we add types

  web-lint:
    name: Web — Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: cd web && npm ci

      - name: ESLint
        run: cd web && npm run lint

      - name: TypeScript check
        run: cd web && npx tsc --noEmit

  mobile-analyze:
    name: Flutter — Analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: stable

      - name: Install dependencies
        run: cd mobile && flutter pub get

      - name: Analyze
        run: cd mobile && flutter analyze --no-fatal-infos

      - name: Format check
        run: cd mobile && dart format --output=none --set-exit-if-changed lib/

  docker-build:
    name: Docker Build Check
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t krasivo-backend:${{ github.sha }} ./backend

      - name: Build web image
        run: docker build -t krasivo-web:${{ github.sha }} ./web
