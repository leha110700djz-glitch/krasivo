name: krasivo
description: Платформа для записи в салоны красоты «Красиво»
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  go_router: ^13.2.0
  dio: ^5.4.2
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.2.2
  cached_network_image: ^3.3.1
  image_picker: ^1.0.7
  intl: ^0.19.0
  table_calendar: ^3.1.1
  shimmer: ^3.0.0
  fluttertoast: ^8.2.4
  flutter_svg: ^2.0.10+1
  lottie: ^3.1.0
  json_annotation: ^4.8.1
  firebase_core: ^3.3.0
  firebase_messaging: ^15.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.8
  riverpod_generator: ^2.3.11
  json_serializable: ^6.7.1

flutter:
  uses-material-design: true
